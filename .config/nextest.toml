[profile.default]
# Light tests run on every CPU thread. Heavy tests queue in their group below.
test-threads = "num-cpus"
slow-timeout = { period = "120s", terminate-after = 4 }
# Tuning tests run real tunes against wall-clock budgets, which a loaded machine runs out, so they
# run on their own under the `tuning` profile. A name or filter on the command line still picks them.
default-filter = 'not ((package(av-denoise) & test(/^(tune::tests::driver|pipeline::tests::tune)::/)) | binary_id(av-denoise::tuning))'

[test-groups]
# Tests that compile many kernel variants, which saturate the CPU on an empty kernel cache.
heavy-compile = { max-threads = 12 }

[[profile.default.overrides]]
filter = 'test(/^(tune::tests::(collab|window|window_golden)|collab::tests::fused|nlmeans::tests::temporal|nl4d::tests::(engine|search_ring|strength_map|noise_map)|nl4d::grain::tests::export)::/)'
slow-timeout = { period = "120s", terminate-after = 10 }
test-group = 'heavy-compile'

[profile.tuning]
test-threads = 2
slow-timeout = { period = "120s", terminate-after = 10 }
default-filter = '(package(av-denoise) & test(/^(tune::tests::driver|pipeline::tests::tune)::/)) | binary_id(av-denoise::tuning)'
