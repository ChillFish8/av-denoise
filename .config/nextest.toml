[profile.default]
# Light tests run on every CPU thread. Heavy tests queue in their groups below.
test-threads = "num-cpus"
slow-timeout = { period = "120s", terminate-after = 4 }

[test-groups]
# Each full tuning pass JIT-compiles every candidate inside a 600 s budget.
tuning-passes = { max-threads = 8 }
# Tests that compile many kernel variants, which saturate the CPU on an empty kernel cache.
heavy-compile = { max-threads = 12 }

[[profile.default.overrides]]
filter = 'test(/^tune::tests::driver::(an_nl4d_pass_records_a_ranking_for_every_plane|a_tuned_grain_export_denoiser_drains_only_the_real_streams_grain)$/) | binary_id(av-denoise::tuning)'
slow-timeout = { period = "120s", terminate-after = 10 }
test-group = 'tuning-passes'

[[profile.default.overrides]]
filter = 'test(/^(tune::tests::(collab|window)|collab::tests::fused|nlmeans::tests::temporal|nl4d::tests::(engine|search_ring|strength_map|noise_map)|nl4d::grain::tests::export)::/)'
slow-timeout = { period = "120s", terminate-after = 10 }
test-group = 'heavy-compile'
