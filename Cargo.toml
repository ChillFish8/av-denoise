[package]
name = "av-denoise"
version = "0.1.0"
edition = "2024"
description = "Fast and efficient video denoising using accelerated nlmeans."

[dependencies]
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
strum_macros = "0.28"
strum = "0.28"
rust_decimal = "1"

serde = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
mimalloc = { version = "0.1", default-features = false }
cubecl = { version = "0.9", features = ["std"] }

[dev-dependencies]
futures = "0.3"

[features]
vulkan = ["cubecl/wgpu", "cubecl/wgpu-spirv"]
metal = ["cubecl/wgpu", "cubecl/wgpu-msl"]
cuda = ["cubecl/cuda"]
rocm = ["cubecl/hip"]
cpu = ["cubecl/cpu"]
default = ["cpu", "vulkan"]

[[bench]]
name = "nlmeans"
harness = false

[[bench]]
name = "bench_kernels"
harness = false
