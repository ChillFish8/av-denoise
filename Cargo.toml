[workspace]
resolver = "3"
members = ["av-denoise-core", "av-denoise", "av-denoise-vs"]

[workspace.package]
version = "0.7.0-alpha1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/ChillFish8/av-denoise"
readme = "README.md"

[workspace.dependencies]
anyhow = "1"
bytesize = "2"
crossbeam-channel = "0.5"
thiserror = "2"
tracing = "0.1"
strum = "0.28"
strum_macros = "0.28"
arrow-array = "60.1.0"
arrow-schema = "60.1.0"
parquet = { version = "60.1.0", default-features = false, features = ["arrow", "zstd"] }
cubecl = { git = "https://github.com/ChillFish8/cubecl", rev = "e3c9246de93b97e0f3355e18c86e3afbb7cbd2f5", features = ["std", "rusqlite"] }
cubecl-environment = { git = "https://github.com/ChillFish8/cubecl", rev = "e3c9246de93b97e0f3355e18c86e3afbb7cbd2f5", default-features = false, features = ["rusqlite"] }
av-denoise-core = { path = "av-denoise-core", version = "0.7.0-alpha1", default-features = false }
av-denoise = { path = "av-denoise", version = "0.7.0-alpha1", default-features = false }

[profile.test]
opt-level = 3
debug-assertions = true
overflow-checks = true
