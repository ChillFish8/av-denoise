[package]
name = "av-denoise"
version = "0.1.0"
edition = "2024"
description = "Fast and efficient video denoising using accelerated BM3D."

[dependencies]
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
strum_macros = "0.28"
strum = "0.28"
rust_decimal = "1"
burn-collective = "0.21.0-pre.4"
burn-store = "0.21.0-pre.4"

serde = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
mimalloc = { version = "0.1", default-features = false }
rustix = { version = "1", features = ["pipe"] }
burn = { version = "0.21.0-pre.4", features = ["autotune", "fusion"] }
cubecl = { version = "0.9", features = ["std"] }

[build-dependencies]
burn-onnx = { git = "https://github.com/tracel-ai/burn-onnx.git", rev = "97bad58" }

[features]
vulkan = ["burn/vulkan", "cubecl/wgpu", "cubecl/wgpu-spirv"]
metal = ["burn/metal", "cubecl/wgpu", "cubecl/wgpu-msl"]
cuda = ["burn/cuda", "cubecl/cuda"]
rocm = ["burn/rocm", "cubecl/hip"]
cpu = ["burn/cpu", "cubecl/cpu"]
default = ["cpu", "vulkan"]
