[package]
name = "av-denoise"
version = "0.1.0"
edition = "2024"
description = "Fast and efficient video denoising using accelerated BM3D."

[dependencies]
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
strum_macros = "0.28"
strum = "0.28"
rust_decimal = "1"

serde = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
mimalloc = { version = "0.1", default-features = false }
rustix = { version = "1", features = ["pipe"] }
