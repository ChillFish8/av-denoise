[workspace]
resolver = "3"
members = ["av-denoise-core", "av-denoise", "av-denoise-vs"]

[workspace.package]
version = "0.4.0-alpha7"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/ChillFish8/av-denoise"
readme = "README.md"

[workspace.dependencies]
anyhow = "1"
bytesize = "2"
crossbeam-channel = "0.5"
thiserror = "2"
tracing = "0.1"
strum = "0.28"
strum_macros = "0.28"
bon = "3"
cubecl = { version = "0.10", features = ["std"] }
av-denoise-core = { path = "av-denoise-core", version = "0.4.0-alpha7", default-features = false }
