[project]
name = "scripts"
version = "0.1.0"
description = "Helper scripts for measuring and comparing denoiser runs"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["pydantic>=2.9"]

# The VapourSynth arms of the end-to-end benchmark, our own plugin and the
# V-BM3D reference. It is a group rather than a dependency because the rest
# of the scripts here need none of it, and the stack is large.
[dependency-groups]
vs = [
    "vapoursynth>=79",
    "vsavd",
    # Pinned: 2.17.x bundles HIP 7.14, whose bitcode needs symbols this
    # machine's ROCm does not carry, and every BM3D call fails with an
    # undefined `__amd_streamOpsDecrement` reported as
    # `hipStreamCreateWithFlags ... out of memory`. 2.16 bundles HIP 7.0
    # and works. Re-check this pin if the system ROCm is upgraded.
    "vapoursynth-bm3dhip==2.16",
    "vsjetpack[amd,denoise]>=2.2.4",
]

# The local crate rather than the published wheel, so the plugin arms of the
# benchmark measure the same working tree the CLI arms do. `uv sync` builds
# the cdylib through setuptools-rust the first time, and after a Rust change
# `just benchmark-e2e` reinstalls it so a stale build is never measured.
[tool.uv.sources]
vsavd = { path = "../packages/vs-avd", editable = true }

[[tool.uv.index]]
url = "https://jaded-encoding-thaumaturgy.github.io/vs-wheels/simple"
