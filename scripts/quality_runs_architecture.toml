input = "./data/clean-1080p.mkv"
workdir = "./data/quality_runs_light"
frames = 240
seed = 4242
noise = [4, 6, 8]

# Same tables as quality_runs_light.toml, reused verbatim so the cached
# reference/noisy clips in workdir are shared rather than regenerated.
[strengths]
4 = 1.5
6 = 2.0
8 = 2.0

[bm3d_sigmas]
4 = 7
6 = 12
8 = 16

# ---------------------------------------------------------------------------
# Task H1: does splitting nl3d's front end into temporal-only vs the full
# temporal+spatial front end change denoising quality on synthetic noise,
# the way it is hypothesised to change texture preservation on real grain?
# ---------------------------------------------------------------------------

[[runs]]
name = "noisy"
kind = "noisy"

[[runs]]
name = "av_hq_temporal_r2"
kind = "av-denoise"
workers = 2
args = ["--variant", "hq", "--temporal-radius", "2", "--channel-mode", "luma,chroma"]

[[runs]]
name = "av_nl3d_temporal_r2"
kind = "av-denoise-nl3d"
workers = 2
args = ["--variant", "hq", "--temporal-radius", "2", "--channel-mode", "luma,chroma"]

# The collaborative filter effectively alone: temporal-radius 0 AND
# search-radius 0 makes the hq front end a pass-through (confirmed by
# task-D1's sigma_ratio == 1.0000 at this exact combination), so whatever
# denoising happens here is the collaborative stage acting on the raw
# noisy frame.
[[runs]]
name = "av_nl3d_collab_alone_r0s0"
kind = "av-denoise-nl3d"
workers = 2
args = ["--variant", "hq", "--temporal-radius", "0", "--search-radius", "0", "--channel-mode", "luma,chroma"]

# Temporal-only front end: normal temporal radius, search-radius 0, so the
# front end averages across frames but performs no spatial patch averaging.
[[runs]]
name = "av_nl3d_temporal_only_r2s0"
kind = "av-denoise-nl3d"
workers = 2
args = ["--variant", "hq", "--temporal-radius", "2", "--search-radius", "0", "--channel-mode", "luma,chroma"]

[[runs]]
name = "av_nl3d_temporal_only_r2s0_fss03"
kind = "av-denoise-nl3d"
workers = 2
args = ["--variant", "hq", "--temporal-radius", "2", "--search-radius", "0", "--front-strength-scale", "0.3", "--channel-mode", "luma,chroma"]

[[runs]]
name = "av_nl3d_temporal_only_r2s0_fss015"
kind = "av-denoise-nl3d"
workers = 2
args = ["--variant", "hq", "--temporal-radius", "2", "--search-radius", "0", "--front-strength-scale", "0.15", "--channel-mode", "luma,chroma"]

[[runs]]
name = "ffmpeg_bm3d"
kind = "ffmpeg-bm3d"
sigma = "$bm3d_sigma"
