# End-to-end throughput benchmark. Run it with:
#
#   just benchmark-e2e
#   just benchmark-e2e --group 1080p --only avd_nl4d_base --repeats 3
#
# Every variant is a shell command run from the repo root. `{{input}}` is
# replaced with the group's input and `{{output}}` with a per-variant file
# under `output_dir`. A variant that names no `{{output}}`, like the ones
# below, keeps nothing and sends its frames to /dev/null.
#
# fps is amortized. It divides the clip's frame count by the wall clock, so
# startup, shader compilation and scene detection all count. Frames are
# discarded straight to /dev/null rather than through an encoder, so what is
# measured is the denoiser and its y4m output, with nothing downstream. The
# frame count comes from a probe of the input, since a run prints no
# progress of its own to scrape.
#
# The av-denoise arms run `target/release/av-denoise` directly rather than
# through `cargo run`, so compilation is never part of a measurement. The
# `just benchmark-e2e` recipe builds that binary first.
#
# No variant pins a GPU. Each of the three stacks takes its card from an
# environment variable, and every one of them counts the cards in PCI order,
# so the same index means the same card in all three:
#
#   AVD_DEVICE=discrete:1     av-denoise, both the CLI and the plugin arms
#   BENCH_OCL_DEVICE=1        ffmpeg, the device half of `ocl:0.N`
#   BENCH_HIP_DEVICE=1        V-BM3D, through HIP
#
# The CLI reads `AVD_DEVICE` itself. The plugin does not, so the plugin arms
# read it in the shell and pass it through as `--arg device=`.
#
# Running the whole thing on the second card is therefore:
#
#   AVD_DEVICE=discrete:1 BENCH_OCL_DEVICE=1 BENCH_HIP_DEVICE=1 just benchmark-e2e
#
# All three default to the first card. `av-denoise list-devices`, `clinfo -l`
# and `rocm-smi --showbus` list what a machine offers. A single variant can
# override any of them through its own `env` table.
#
# The variants:
#
#   ffmpeg_nlmeans_default     ffmpeg's OpenCL NLMeans on its own defaults
#                              (s=1, p=7, r=15), the external speed baseline.
#                              1080p only, see the note above the 4K group
#   avd_nlmeans_ffmpeg_match   our NLMeans set to those same defaults
#   avd_nlmeans_base           our NLMeans on `--preset base`
#   avd_nl4d_base              our NL4D on `--preset base`
#   avd_vs_nl4d_base           our three denoisers reached through the
#   avd_vs_nlmhq_base          VapourSynth plugin instead of the CLI, so what
#   avd_vs_nlm_base            each front end costs is readable
#   vbm3d_normal/fast/lc       V-BM3D through VapourSynth on its three
#                              cheapest profiles
#
# `avd_vs_nlmhq_base` is the plugin's counterpart to `avd_nlmeans_base`, since
# the CLI's `base` preset resolves `nlmeans` to the `hq` variant.
# `avd_vs_nlm_base` runs the `fast` variant that no CLI arm here covers at
# `base`.
#
# The plugin arms are driven by vspipe on its own defaults, with no `--requests`
# flag, so what they measure is what a VapourSynth user gets. Frames reaching
# the filter out of order cost it a lot of throughput, and pinning the request
# count would hide that.

repeats = 1
warmup = true

# Where `{{output}}` files go. Commented out, so they land in a temporary
# directory that is deleted when the run finishes.
# output_dir = "data/benchmark_e2e"

[[groups]]
name = "1080p"
input = "data/benchmark-samples/1080p-8bit.mkv"

  [[groups.variants]]
  name = "ffmpeg_nlmeans_default"
  command = """
  ffmpeg -hide_banner -nostats -loglevel error -y \
    -init_hw_device opencl=ocl:0.${BENCH_OCL_DEVICE:-0} -filter_hw_device ocl -i {{input}} \
    -vf format=yuv420p,hwupload,nlmeans_opencl,hwdownload,format=yuv420p \
    -f null -
  """

  [[groups.variants]]
  name = "avd_nlmeans_ffmpeg_match"
  command = """
  ./target/release/av-denoise -A vulkan nlmeans --preset veryfast \
    --strength 1.0 --patch-radius 3 --search-radius 7 \
    --workers 2 --input {{input}} > /dev/null
  """

  [[groups.variants]]
  name = "avd_nlmeans_base"
  command = """
  ./target/release/av-denoise -A vulkan nlmeans --workers 2 --input {{input}} > /dev/null
  """

  [[groups.variants]]
  name = "avd_nl4d_base"
  command = """
  ./target/release/av-denoise -A vulkan nl4d --workers 2 --input {{input}} > /dev/null
  """

  [[groups.variants]]
  name = "avd_vs_nl4d_base"
  command = """
  uv run --directory scripts --group vs vspipe \
    --arg src={{input}} --arg algo=nl4d --arg accelerators=vulkan \
    --arg device=${AVD_DEVICE:-default} vs/avd_denoise.vpy - -c y4m > /dev/null
  """

  [[groups.variants]]
  name = "avd_vs_nlmhq_base"
  command = """
  uv run --directory scripts --group vs vspipe \
    --arg src={{input}} --arg algo=nlmhq --arg accelerators=vulkan \
    --arg device=${AVD_DEVICE:-default} vs/avd_denoise.vpy - -c y4m > /dev/null
  """

  [[groups.variants]]
  name = "avd_vs_nlm_base"
  command = """
  uv run --directory scripts --group vs vspipe \
    --arg src={{input}} --arg algo=nlm --arg accelerators=vulkan \
    --arg device=${AVD_DEVICE:-default} vs/avd_denoise.vpy - -c y4m > /dev/null
  """

  [[groups.variants]]
  name = "vbm3d_normal"
  command = """
  uv run --directory scripts --group vs vspipe \
    --arg src={{input}} --arg device=${BENCH_HIP_DEVICE:-0} --arg profile=normal vs/vbm3d_denoise.vpy - -c y4m > /dev/null
  """

  [[groups.variants]]
  name = "vbm3d_fast"
  command = """
  uv run --directory scripts --group vs vspipe \
    --arg src={{input}} --arg device=${BENCH_HIP_DEVICE:-0} --arg profile=fast vs/vbm3d_denoise.vpy - -c y4m > /dev/null
  """

  [[groups.variants]]
  name = "vbm3d_lc"
  command = """
  uv run --directory scripts --group vs vspipe \
    --arg src={{input}} --arg device=${BENCH_HIP_DEVICE:-0} --arg profile=lc vs/vbm3d_denoise.vpy - -c y4m > /dev/null
  """

# The 4K clip is 10-bit, and ffmpeg's OpenCL NLMeans rejects every 10-bit
# pixel format the hwupload path offers. Measuring it here would mean
# converting to 8-bit for that arm alone, which is less work per pixel than
# the other arms do, so the ffmpeg comparison lives in the 1080p group only.
[[groups]]
name = "4k"
input = "data/benchmark-samples/4k-10bit.mkv"

  [[groups.variants]]
  name = "avd_nlmeans_ffmpeg_match"
  command = """
  ./target/release/av-denoise -A vulkan nlmeans --preset veryfast \
