  ./target/release/av-denoise -A vulkan nl4d --workers 2 --input {{input}} \
  | ffmpeg -hide_banner -nostats -loglevel error -y \
      -f yuv4mpegpipe -i - -f null -
  """

  [[groups.variants]]
  name = "vbm3d_normal"
  command = """
  uv run --directory scripts --group vs vspipe \
    --arg src={{input}} --arg device=${BENCH_HIP_DEVICE:-0} --arg profile=normal vs/vbm3d_denoise.vpy - -c y4m \
  | ffmpeg -hide_banner -nostats -loglevel error -y \
      -f yuv4mpegpipe -i - -f null -
  """

  [[groups.variants]]
  name = "vbm3d_fast"
  command = """
  uv run --directory scripts --group vs vspipe \
    --arg src={{input}} --arg device=${BENCH_HIP_DEVICE:-0} --arg profile=fast vs/vbm3d_denoise.vpy - -c y4m \
  | ffmpeg -hide_banner -nostats -loglevel error -y \
      -f yuv4mpegpipe -i - -f null -
  """

  [[groups.variants]]
  name = "vbm3d_lc"
  command = """
  uv run --directory scripts --group vs vspipe \
    --arg src={{input}} --arg device=${BENCH_HIP_DEVICE:-0} --arg profile=lc vs/vbm3d_denoise.vpy - -c y4m \
  | ffmpeg -hide_banner -nostats -loglevel error -y \
