  command = """
  ./target/release/av-denoise -A vulkan nlmeans --workers 2 --input {{input}} \
  | ffmpeg -hide_banner -nostats -loglevel error -y \
      -f yuv4mpegpipe -i - -f null -
  """

  [[groups.variants]]
  name = "avd_nl4d_base"
