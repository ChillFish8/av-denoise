input = "./data/clean-1080p.mkv"
workdir = "./data/quality_runs_light"
# Frames scored per run. Matches quality_runs.toml's convention. The
# clean source clip is 288 frames, so this trims off the last 48.
frames = 240
seed = 4242
# Light noise levels. bench-sample.mkv's own intrinsic grain (measured
# sigma about 0.80 in 8-bit units over this same 240-frame window) sits
# close to these alls values, so its lowest noise row (8) is not a
# clean measurement of light-noise behavior. clean-1080p.mkv measures
# about 0.43 over the same window, so these levels stay noise-dominated
# instead of source-grain-dominated.
noise = [4, 6, 8]

# Strength used at each noise level wherever a run says "$strength",
# calibrated for clean-1080p.mkv specifically. Probed on the fast
# temporal-r2 row over strength {0.6, 0.8, 1.0, 1.5, 2.0} at each
# noise level, picking the value where luma XPSNR peaks and checking
# SSIM does not disagree. Noise 4 peaks at 1.5, a shallow interior
# peak only 0.11 dB above 1.0 and 0.20 dB above 2.0. Noise 6 peaks at
# 2.0, 0.28 dB above 1.5. Noise 8 also peaks at 2.0 but is still
# rising at that grid edge, so its true optimum may sit above 2.0 and
# was not tested.
[strengths]
4 = 1.5
6 = 2.0
8 = 2.0

# Sigma used at each noise level for the `ffmpeg_bm3d` reference row,
# same per-clip-peak convention as quality_runs.toml (not the true
# noise sigma, see that file's [bm3d_sigmas] comment). Found by
# sweeping sigma per level and picking between the XPSNR-Y peak and the
# SSIM peak. True sigma of each noisy clip, measured with the
# Immerkær estimator over the same 240-frame window, anchors the
# ratio. alls 4 measures 2.32 true sigma with a chosen bm3d sigma of 7,
# about 3.0x. alls 6 measures 3.60 with a chosen sigma of 12, about
# 3.3x. alls 8 measures 4.90 with a chosen sigma of 16, about 3.3x.
# All three land at the low end of the 3 to 6x range quality_runs.toml
# found for bench-sample's heavier noise levels, consistent with
# "lower ratio at lighter noise".
#
# These values were swept against an invocation that left `group` at
# ffmpeg's default of 1, which disables block matching. Collaborative
# filtering is on now, so these sigmas are no longer known to be the
# per-clip peak and any `ffmpeg_bm3d` numbers recorded before this
# comment was added are not comparable to later ones.
[bm3d_sigmas]
4 = 7
6 = 12
8 = 16

# ---------------------------------------------------------------------------
# Baseline: the corrupted clip scored against the clean reference. Every
# denoise variant should beat this row on both SSIM and XPSNR.
# ---------------------------------------------------------------------------

[[runs]]
name = "noisy"
kind = "noisy"

# ---------------------------------------------------------------------------
# Current fast mode, temporal radius 2, no motion compensation. Mirrors
# quality_runs.toml's av_temporal_r2 row on the light-noise source.
# ---------------------------------------------------------------------------

[[runs]]
name = "av_temporal_r2"
kind = "av-denoise"
workers = 2
args = ["--variant", "fast", "--temporal-radius", "2", "--channel-mode", "luma,chroma", "--strength", "$strength"]

# ---------------------------------------------------------------------------
# HQ mode: noise level measured automatically, strength is a multiplier
# on it, expected-noise floor subtracted from distances. Radii 2 and 4
# mirror quality_runs.toml's av_hq_temporal_r2 and av_hq_temporal_r4.
# ---------------------------------------------------------------------------

[[runs]]
name = "av_hq_temporal_r2"
kind = "av-denoise"
workers = 2
args = ["--variant", "hq", "--temporal-radius", "2", "--channel-mode", "luma,chroma"]

[[runs]]
name = "av_hq_temporal_r4"
kind = "av-denoise"
workers = 2
args = ["--variant", "hq", "--temporal-radius", "4", "--channel-mode", "luma,chroma"]

# ---------------------------------------------------------------------------
# nl3d: the HQ front end above, followed by a collaborative-filter cleanup
# pass. Same temporal radius and channel mode as the matching av_hq_temporal
# row above it, and no nl3d-specific flags are set, so both arms run
# Nl3dOptions::default(). The point of running these two rows next to
# av_hq_temporal_r2/r4 is that the front end is identical, so whatever
# XPSNR/SSIM delta shows up is attributable to the collaborative stage
# alone, not to a different noise estimate or a different strength table.
#
# The default is now calibrated (front_strength_scale 0.5, k_max 8,
# tau_match 3.0, lambda_ht 2.7, residual_sigma_scale 1.9), swept on this
# same clip at temporal radius 2, one dial at a time with the others
# pinned, then checked with a small joint sweep for interaction. k_max
# and tau_match were left at their pre-existing values, not swept.
#
# residual_sigma_scale went first, over 1.0, 1.4, 1.9, 2.4, 3.0,
# bracketed on both sides at noise 4, 6, and 8. 1.9 won on the value
# whose worst luma XPSNR across the three levels is highest, matching a
# separate residual-noise measurement (src/nlmeans/tests/weight_ratio.rs)
# that found the front end's true residual running about 1.92x the
# analytic formula's prediction. SSIM agreed at every point.
#
# front_strength_scale went next, at residual_sigma_scale 1.9, over 0.6,
# 0.8, 1.0. 0.6 won at every noise level and sat at the grid's edge, so
# the grid was extended down through 0.3, 0.4, 0.5. Luma XPSNR turned
# out to be a broad, nearly flat plateau from 0.3 to 0.6 at every noise
# level, clearly ahead of 0.8 and 1.0, so 0.5, the plateau's centre, was
# chosen over the edge value. SSIM does not disagree anywhere on the
# plateau.
#
# lambda_ht went last, at the two values above, over 2.0, 2.7, 3.5. Luma
# XPSNR favors 2.0 over 2.7 at noise 4 and 6 but ties it at noise 8,
# while luma SSIM favors 2.7 at noise 6 and 8. 2.7 was kept, since it
# wins the noise level where XPSNR itself is tied and SSIM is not, and a
# check at 1.5 confirmed the value was already bracketed rather than
# sitting on a still-rising edge. This is the one dial where the two
# metrics point different directions depending on noise level.
#
# A joint check varying front_strength_scale and lambda_ht together, one
# step either side of the chosen point (0.4/0.6 and 2.0/3.5), found no
# combination beating the chosen point by more than run-to-run noise, so
# no interaction large enough to move the calibration.
#
# Radius 4 was checked afterward with these same three values pinned
# rather than swept again, and showed the same or larger XPSNR/SSIM gain
# over its own av_hq_temporal_r4 row at every noise level, so the
# radius-2 calibration carries over.
# ---------------------------------------------------------------------------

[[runs]]
name = "av_nl3d_temporal_r2"
kind = "av-denoise-nl3d"
workers = 2
args = ["--variant", "hq", "--temporal-radius", "2", "--channel-mode", "luma,chroma"]

[[runs]]
name = "av_nl3d_temporal_r4"
kind = "av-denoise-nl3d"
workers = 2
args = ["--variant", "hq", "--temporal-radius", "4", "--channel-mode", "luma,chroma"]

# ---------------------------------------------------------------------------
# External baseline: BM3D via ffmpeg's CPU filter, run at its per-clip
# sigma peak rather than the true noise sigma (see the [bm3d_sigmas]
# comment above).
# ---------------------------------------------------------------------------

[[runs]]
name = "ffmpeg_bm3d"
kind = "ffmpeg-bm3d"
sigma = "$bm3d_sigma"
