input = "./data/bench-sample.mkv"
workdir = "./data/quality_runs"
# Frames scored per run. The reference clip is trimmed to this length
# once and cached, so all runs compare the same segment.
frames = 240
seed = 4242
# ffmpeg `noise` filter `alls` strengths (8-bit amplitude units).
noise = [8, 16, 28]

# Strength used at each noise level wherever a run says "$strength".
# A single fixed strength cannot serve every level — 1.0 barely acts
# above alls≈8, leaving denoised rows indistinguishable from `noisy`.
[strengths]
8 = 1.5
16 = 3.0
28 = 5.0

# Sigma used at each noise level for the `bm3dhip` reference row. These
# are hand-tuned per-clip peaks originally found by sweeping sigma
# against this bench clip for ffmpeg's `bm3d` filter, not the true 8-bit
# noise sigma and not re-swept for bm3dhip specifically, so they are a
# starting point for bm3dhip rather than its own per-clip peak. Peaks
# landed around 3 to 6 times the true sigma and the ratio was not
# constant across noise levels.
#
# That original sweep ran against an invocation that left `group` at
# ffmpeg's default of 1, which disables block matching, so it is not the
# sigma ffmpeg's `bm3d` would peak at with collaborative filtering on
# either.
[bm3d_sigmas]
8 = 15
16 = 40
28 = 55

# ---------------------------------------------------------------------------
# Baseline: the corrupted clip scored against the clean reference. Every
# denoise variant should beat this row.
# ---------------------------------------------------------------------------

[[runs]]
name = "noisy"
kind = "noisy"

# ---------------------------------------------------------------------------
# Current fast mode at increasing capability: spatial, temporal, temporal
# with motion compensation, and everything on.
# ---------------------------------------------------------------------------

[[runs]]
name = "av_spatial"
kind = "av-denoise"
workers = 2
args = ["--variant", "fast", "--temporal-radius", "0", "--channel-mode", "luma,chroma", "--strength", "$strength"]

[[runs]]
name = "av_temporal_r2"
kind = "av-denoise"
workers = 2
args = ["--variant", "fast", "--temporal-radius", "2", "--channel-mode", "luma,chroma", "--strength", "$strength"]

[[runs]]
name = "av_temporal_r2_mc"
kind = "av-denoise"
workers = 2
args = [
    "--variant", "fast",
    "--temporal-radius", "2",
    "--channel-mode", "luma,chroma",
    "--strength", "$strength",
    "--motion-compensation",
]

[[runs]]
name = "av_full_r2"
kind = "av-denoise"
workers = 2
args = [
    "--variant", "fast",
    "--temporal-radius", "2",
    "--channel-mode", "luma,chroma",
    "--strength", "$strength",
    "--motion-compensation",
    "--prefilter", "bilateral:3.0,0.02",
]

# ---------------------------------------------------------------------------
# External baseline: ffmpeg's OpenCL nlmeans.
# ---------------------------------------------------------------------------

[[runs]]
name = "ffmpeg_spatial"
kind = "ffmpeg-nlmeans"
strength = "$strength"
patch = 7
search = 15

# External baseline: V-BM3D via bm3dhip (GPU, VapourSynth), radius 2 to
# match this file's primary temporal window (av_temporal_r2,
# av_hq_temporal_r2, av_hq_temporal_r2_mc, av_hq_temporal_r2_pilot all run
# at temporal-radius 2). ffmpeg's `bm3d` filter (score_ffmpeg_bm3d in the
# .py) has no temporal window at all, so it measures a different amount
# of work than any temporal av-denoise arm and no row here uses it any
# more. Sigma is the per-clip peak from the [bm3d_sigmas] comment above,
# not the true noise sigma.
[[runs]]
name = "bm3dhip_r2"
kind = "bm3dhip"
sigma = "$bm3d_sigma"
radius = 2

# ---------------------------------------------------------------------------
# HQ mode: noise level measured automatically, strength is a multiplier
# on it, expected-noise floor subtracted from distances.
# ---------------------------------------------------------------------------

[[runs]]
name = "av_hq_spatial"
kind = "av-denoise"
workers = 2
args = ["--variant", "hq", "--temporal-radius", "0", "--channel-mode", "luma,chroma"]

[[runs]]
name = "av_hq_temporal_r2"
kind = "av-denoise"
workers = 2
args = ["--variant", "hq", "--temporal-radius", "2", "--channel-mode", "luma,chroma"]

# Confidence weighting is on by default in the row above; this row turns
# it off so the harness can quantify what it buys.
[[runs]]
name = "av_hq_temporal_r2_noconf"
kind = "av-denoise"
workers = 2
args = [
    "--variant", "hq",
    "--temporal-radius", "2",
    "--channel-mode", "luma,chroma",
    "--hq-no-temporal-confidence",
]

# HQ temporal with motion compensation, confidence weighting still on by
# default. Tracks whether confidence closes MC's own quality deficit
# (MC alone historically cost some XPSNR vs no-MC temporal).
[[runs]]
name = "av_hq_temporal_r2_mc"
kind = "av-denoise"
workers = 2
args = [
    "--variant", "hq",
    "--temporal-radius", "2",
    "--channel-mode", "luma,chroma",
    "--motion-compensation",
]

# ---------------------------------------------------------------------------
# Temporal radius 4, no MC vs MC. `--motion-compensation` has no
# way to pick an estimation strategy from the CLI. it always resolves
# automatically from `--temporal-radius`, and at r4 that resolves to
# `Chained` (radius 4 is at or above the auto-resolution threshold), so
# this row measures chained's quality at the radius where its reach
# advantage should show up most clearly. `av_hq_temporal_r2_mc` above
# stays on the direct path, since auto resolves to direct at r2.
# ---------------------------------------------------------------------------

[[runs]]
name = "av_hq_temporal_r4"
kind = "av-denoise"
workers = 2
args = ["--variant", "hq", "--temporal-radius", "4", "--channel-mode", "luma,chroma"]

[[runs]]
name = "av_hq_temporal_r4_mc"
kind = "av-denoise"
workers = 2
args = [
    "--variant", "hq",
    "--temporal-radius", "4",
    "--channel-mode", "luma,chroma",
    "--motion-compensation",
]

# Opt-in NLM spatial pilot. `--prefilter` defaults to none for both
# algorithms, so this tracks the pilot lever at its calibrated default
# scale (0.4) against the `av_hq_temporal_r2` no-pilot baseline above.
[[runs]]
name = "av_hq_temporal_r2_pilot"
kind = "av-denoise"
workers = 2
args = [
    "--variant", "hq",
    "--temporal-radius", "2",
    "--channel-mode", "luma,chroma",
    "--prefilter", "nlm",
]
