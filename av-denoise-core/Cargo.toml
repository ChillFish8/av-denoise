[package]
name = "av-denoise-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "GPU denoising engines that read and write CubeCL handles"
categories = ["multimedia::video"]
keywords = ["cubecl", "denoise", "gpu"]
readme = "README.md"
exclude = [
    "scripts/",
    ".idea/",
    "cubecl.toml",
    ".github/",
    "Justfile",
    "src/noise/tests/clips/"
]

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
anyhow = "1"
thiserror = "2"
tracing = "0.1"
strum_macros = "0.28"
strum = "0.28"
half = "2.7.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

cubecl = { workspace = true }
cubecl-environment = { workspace = true }
wgpu = { version = "30", optional = true }
cudarc = { version = "0.19", optional = true, default-features = false, features = ["std", "driver"] }
cubecl-hip-sys = { version = "7.1.5280200", optional = true }

# The `.avds` grain data file
arrow-array = { workspace = true, optional = true }
arrow-schema = { workspace = true, optional = true }
parquet = { workspace = true, optional = true }

[dev-dependencies]
futures = "0.3"
clap = { version = "4", features = ["derive"] }
y4m = "0.8"
tempfile = "3"

[features]
vulkan = ["cubecl/vulkan", "dep:wgpu"]
metal = ["cubecl/metal"]
cuda = ["cubecl/cuda", "dep:cudarc"]
rocm = ["cubecl/hip", "dep:cubecl-hip-sys"]
# Reading and writing `.avds` grain data files.
avds = ["dep:arrow-array", "dep:arrow-schema", "dep:parquet"]
default = ["vulkan"]

[[bench]]
name = "nlmeans"
harness = false

[[bench]]
name = "bench_kernels"
harness = false

[[bench]]
name = "motion"
harness = false

[[bench]]
name = "nl4d_ablation"
harness = false

[[bench]]
name = "mc_accuracy"
harness = false

[[bench]]
name = "tune_timing_check"
harness = false

[[bench]]
name = "gmc_fit"
harness = false

