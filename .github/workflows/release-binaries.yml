name: Release binaries

on:
  release:
    types: [published]
  # A dispatch run is a dry run. It builds, smoke tests and checks the linkage of
  # the statically linked CLI, packages it with its licences, and packages the VapourSynth
  # plugin. Both archives upload as workflow artifacts but never attach to a release. Leave `version` empty to just check that everything still compiles.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, e.g. 0.4.0-alpha4. Defaults to the Cargo.toml version."
        required: false
        type: string

permissions:
  contents: read

jobs:
  resolve-version:
    name: Resolve release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve and check version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          cargo_version="$(python3 -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('Cargo.toml').read_text())['workspace']['package']['version'])")"

          if [ "${EVENT_NAME}" = "release" ]; then
            version="${RELEASE_TAG}"
          else
            # A dispatch run that names no version is only checking that the targets
            # build, so it inherits whatever the tree currently says.
            version="${DISPATCH_VERSION:-${cargo_version}}"
          fi

          version="${version#v}"

          if ! [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'${version}' is not a valid semantic version (expected X.Y.Z or X.Y.Z-suffix)"
            exit 1
          fi

          # A mismatch is fatal for a real release, since the wrong version would ship.
          # A dispatch run attaches nothing, so it only warns and carries on building.
          if [ "${cargo_version}" != "${version}" ]; then
            message="version ${version} does not match Cargo.toml ${cargo_version}"
            if [ "${EVENT_NAME}" = "release" ]; then
              echo "::error::${message}"
              exit 1
            else
              echo "::warning::${message}"
            fi
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"

  build:
    name: ${{ matrix.platform }}
    needs: resolve-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # One binary per platform carrying every backend that platform can reach.
        # The `Accelerator` variants are additively feature-gated, and both cudarc
        # and ash load their driver libraries at runtime, so a vulkan+cuda binary
        # runs on a host that has only one of them and `--accelerators` still picks.
        # Linux builds on 22.04 for the older glibc floor.
        # The CLI links ffms2 and FFmpeg statically from vcpkg, so the host needs neither.
        #
        # The VapourSynth plugin ships from the same job, built from the same tree
        # with the same backends. `rocm` is left out of `plugin_features` for the
        # reason the wheels leave it out: it hard-links the ROCm libraries, so a
        # plugin carrying it fails to load on a host without ROCm installed.
        include:
          - os: ubuntu-22.04
            platform: linux-x86
            features: vulkan,cuda,static-ffms2
            triplet: x64-linux-release
            archive: av-denoise-linux-x86.tar.gz
            binary: av-denoise
            plugin_features: vulkan,cuda
            plugin_library: libav_denoise_vs.so
            plugin_archive: av-denoise-vs-linux-x86.tar.gz
          - os: windows-latest
            platform: win64-x86
            features: vulkan,cuda,static-ffms2
            triplet: x64-windows-static-md-release
            archive: av-denoise-win64-x86.zip
            binary: av-denoise.exe
            plugin_features: vulkan,cuda
            plugin_library: av_denoise_vs.dll
            plugin_archive: av-denoise-vs-win64-x86.zip
          - os: macos-14
            platform: macos-aarch64
            features: metal,static-ffms2
            triplet: arm64-osx-release
            archive: av-denoise-macos-aarch64.tar.gz
            binary: av-denoise
            plugin_features: metal
            plugin_library: libav_denoise_vs.dylib
            plugin_archive: av-denoise-vs-macos-aarch64.zip
    concurrency:
      group: release-binaries-${{ matrix.platform }}-${{ github.event.release.tag_name || inputs.version || github.run_id }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # nasm builds av-scenechange's assembly and clang backs ffms2-sys's bindgen. The
      # rest is what vcpkg needs to build FFmpeg and dav1d.
      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nasm clang libclang-dev pkg-config ninja-build

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install nasm pkg-config ninja

      - name: Install NASM (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1

      - name: Point bindgen at LLVM (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append'

      - name: Checkout vcpkg
        shell: bash
        run: |
          set -euo pipefail
          baseline="$(jq -r '."builtin-baseline"' vcpkg.json)"
          git clone https://github.com/microsoft/vcpkg.git "${RUNNER_TEMP}/vcpkg"
          git -C "${RUNNER_TEMP}/vcpkg" checkout --quiet "${baseline}"
          echo "VCPKG_ROOT=${RUNNER_TEMP}/vcpkg" >> "${GITHUB_ENV}"
          echo "VCPKG_DEFAULT_BINARY_CACHE=${RUNNER_TEMP}/vcpkg-cache" >> "${GITHUB_ENV}"
          mkdir -p "${RUNNER_TEMP}/vcpkg-cache"

      # A cold FFmpeg and dav1d build takes 20-40 minutes. The packages are saved as soon
      # as vcpkg finishes, so a later failure in the job does not throw them away.
      - name: Restore vcpkg packages
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-${{ matrix.triplet }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg/ports/**') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-${{ matrix.triplet }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg/ports/**') }}-
            vcpkg-${{ matrix.triplet }}-

      - name: Build static ffms2 and FFmpeg
        shell: bash
        env:
          TRIPLET: ${{ matrix.triplet }}
        run: |
          set -euo pipefail
          case "${RUNNER_OS}" in
            Windows) "${VCPKG_ROOT}/bootstrap-vcpkg.bat" -disableMetrics ;;
            *) "${VCPKG_ROOT}/bootstrap-vcpkg.sh" -disableMetrics ;;
          esac
          "${VCPKG_ROOT}/vcpkg" install --triplet "${TRIPLET}" --host-triplet "${TRIPLET}"

      - name: Save vcpkg packages
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      # ffms2-sys reads the headers and archive from FFMS_INCLUDE_DIR and FFMS_LIB_DIR,
      # and the build script reads the rest of the chain through pkg-config.
      - name: Export the static library paths
        shell: bash
        env:
          TRIPLET: ${{ matrix.triplet }}
        run: |
          set -euo pipefail
          prefix="${GITHUB_WORKSPACE}/vcpkg_installed/${TRIPLET}"
          if [ "${RUNNER_OS}" = "Windows" ]; then
            prefix="$(cygpath -w "${prefix}")"
            echo "PKG_CONFIG=${prefix}\\tools\\pkgconf\\pkgconf.exe" >> "${GITHUB_ENV}"
            echo "FFMS_INCLUDE_DIR=${prefix}\\include" >> "${GITHUB_ENV}"
            echo "FFMS_LIB_DIR=${prefix}\\lib" >> "${GITHUB_ENV}"
            echo "PKG_CONFIG_PATH=${prefix}\\lib\\pkgconfig" >> "${GITHUB_ENV}"
          else
            echo "FFMS_INCLUDE_DIR=${prefix}/include" >> "${GITHUB_ENV}"
            echo "FFMS_LIB_DIR=${prefix}/lib" >> "${GITHUB_ENV}"
            echo "PKG_CONFIG_PATH=${prefix}/lib/pkgconfig" >> "${GITHUB_ENV}"
          fi

      - name: Build the CLI
        run: cargo build --release -p av-denoise --no-default-features --features ${{ matrix.features }}

      # Hosted runners have no accelerator, so this only proves the binary starts.
      - name: Smoke test
        shell: bash
        run: ./target/release/${{ matrix.binary }} --help > /dev/null

      - name: Set up MSVC tools (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # Fails if the binary still loads ffms2, FFmpeg or dav1d from the host.
      - name: Check nothing is linked dynamically
        shell: bash
        env:
          BINARY: target/release/${{ matrix.binary }}
        run: |
          set -euo pipefail
          case "${RUNNER_OS}" in
            Linux) listing="$(ldd "${BINARY}")" ;;
            macOS) listing="$(otool -L "${BINARY}")" ;;
            Windows) listing="$(dumpbin //dependents "${BINARY}")" ;;
          esac
          echo "${listing}"
          if echo "${listing}" | grep -Ei 'ffms2|avcodec|avformat|avutil|swscale|swresample|dav1d'; then
            echo "::error::${BINARY} links a codec library dynamically"
            exit 1
          fi

      # The binary ships with the project licence and the licences of everything
      # linked into it. Linux and macOS get a tarball to keep the file mode.
      # COPYFILE_DISABLE stops macOS tar adding ._ metadata entries to the archive.
      - name: Package the CLI
        shell: bash
        env:
          COPYFILE_DISABLE: "1"
          BINARY: ${{ matrix.binary }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          staging="${RUNNER_TEMP}/cli"
          mkdir -p "${staging}"
          cp "target/release/${BINARY}" LICENSE THIRD-PARTY-LICENSES "${staging}/"
          case "${RUNNER_OS}" in
            Windows) 7z a -tzip "${GITHUB_WORKSPACE}/${ARCHIVE}" "${staging}/*" ;;
            *) tar -czf "${GITHUB_WORKSPACE}/${ARCHIVE}" -C "${staging}" "${BINARY}" LICENSE THIRD-PARTY-LICENSES ;;
          esac

      - name: List the CLI archive
        shell: bash
        env:
          ARCHIVE: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          case "${ARCHIVE}" in
            *.zip) 7z l "${ARCHIVE}" ;;
            *) tar -tvzf "${ARCHIVE}" ;;
          esac

      - name: Upload CLI archive
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

      - name: Build the VapourSynth plugin
        run: cargo build --release -p av-denoise-vs --no-default-features --features ${{ matrix.plugin_features }}

      # The archive holds the shared library alone, so it drops straight into a
      # VapourSynth autoload directory once unpacked. Linux gets a tarball to keep
      # the file mode, the other two get a zip.
      - name: Package the VapourSynth plugin
        shell: bash
        env:
          PLUGIN_LIBRARY: ${{ matrix.plugin_library }}
          PLUGIN_ARCHIVE: ${{ matrix.plugin_archive }}
        run: |
          set -euo pipefail
          test -f "target/release/${PLUGIN_LIBRARY}"
          cd target/release
          case "${RUNNER_OS}" in
            Linux) tar -czf "${GITHUB_WORKSPACE}/${PLUGIN_ARCHIVE}" "${PLUGIN_LIBRARY}" ;;
            macOS) zip -j "${GITHUB_WORKSPACE}/${PLUGIN_ARCHIVE}" "${PLUGIN_LIBRARY}" ;;
            Windows) 7z a -tzip "${GITHUB_WORKSPACE}/${PLUGIN_ARCHIVE}" "${PLUGIN_LIBRARY}" ;;
          esac

      - name: Upload VapourSynth plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ matrix.plugin_archive }}
          path: ${{ matrix.plugin_archive }}
          if-no-files-found: error

      # vcpkg's build logs are the only record of a failed port build.
      - name: Upload vcpkg logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vcpkg-logs-${{ matrix.platform }}
          path: ${{ runner.temp }}/vcpkg/buildtrees/**/*.log
          if-no-files-found: ignore

  publish:
    name: Publish release binaries
    needs: [resolve-version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: release-assets
          merge-multiple: true

      - name: Download VapourSynth plugin artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: plugin-*
          path: release-assets
          merge-multiple: true

      - name: List downloaded release assets
        run: ls -la release-assets

      - name: Attach release assets to the GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*

      - name: Report the dry run
        if: github.event_name != 'release'
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          set -euo pipefail
          {
            echo "### Dry run"
            echo
            echo "All three targets built a statically linked CLI archive and a VapourSynth plugin at version \`${VERSION}\`."
            echo "Each binary passed its \`--help\` smoke test and the check for dynamically linked codec libraries."
            echo "Nothing was attached to a release. The CLI and plugin archives are on this run as workflow artifacts."
          } >> "${GITHUB_STEP_SUMMARY}"
