name: Release images

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to tag, e.g. 0.4.0"
        required: true
        type: string
      push_latest:
        description: "Also move the -latest tag"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: ${{ matrix.backend }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [vulkan, cuda, rocm]
    concurrency:
      group: release-images-${{ matrix.backend }}-${{ github.event.release.tag_name || inputs.version }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reclaim runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache \
            /usr/local/share/powershell /usr/share/swift
          df -h /

      - name: Resolve version and tags
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          DISPATCH_VERSION: ${{ inputs.version }}
          DISPATCH_PUSH_LATEST: ${{ inputs.push_latest }}
          BACKEND: ${{ matrix.backend }}
        run: |
          set -euo pipefail

          if [ "${EVENT_NAME}" = "release" ]; then
            raw_version="${RELEASE_TAG}"
            if [ "${RELEASE_PRERELEASE}" = "false" ]; then
              stable=true
            else
              stable=false
            fi
          else
            raw_version="${DISPATCH_VERSION}"
            if [ "${DISPATCH_PUSH_LATEST}" = "true" ]; then
              stable=true
            else
              stable=false
            fi
          fi

          version="${raw_version#v}"

          if ! [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'${version}' is not a valid semantic version (expected X.Y.Z or X.Y.Z-suffix)"
            exit 1
          fi

          image="ghcr.io/${GITHUB_REPOSITORY,,}"

          tags=("${image}:${BACKEND}-${version}")

          if [ "${stable}" = "true" ]; then
            minor="${version%%-*}"
            minor="${minor%.*}"
            tags+=("${image}:${BACKEND}-${minor}")
            tags+=("${image}:${BACKEND}-latest")
          fi

          {
            echo "version=${version}"
            echo "image=${image}"
            echo "tags<<GHTAGS"
            printf '%s\n' "${tags[@]}"
            echo "GHTAGS"
          } >> "${GITHUB_OUTPUT}"

      - name: Check crate version matches release
        env:
          RESOLVED_VERSION: ${{ steps.meta.outputs.version }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          crate_line="$(grep -m1 '^version = ' Cargo.toml)"
          crate_version="${crate_line#version = \"}"
          crate_version="${crate_version%\"}"

          if [ "${crate_version}" != "${RESOLVED_VERSION}" ]; then
            message="Cargo.toml version (${crate_version}) does not match resolved release version (${RESOLVED_VERSION})"
            if [ "${EVENT_NAME}" = "release" ]; then
              echo "::error::${message}"
              exit 1
            else
              echo "::warning::${message}"
            fi
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.backend }}.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          provenance: false
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.description=av-denoise (${{ matrix.backend }} backend)
