name: PR checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  rust-fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # rustfmt.toml turns on unstable_features, so the check needs nightly. Nothing
      # is compiled here, so no system libraries are installed.
      - name: Install nightly rustfmt
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo +nightly fmt --all --check

  rust-clippy:
    name: clippy
    # Pinned to the release Linux runner so both jobs share one vcpkg toolchain and cache.
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # nasm builds av-scenechange's assembly and clang backs bindgen. The rest is what
      # vcpkg needs to build BestSource, FFmpeg and dav1d. vapoursynth-sys ships
      # pregenerated bindings and loads VapourSynth through libloading, so av-denoise-vs
      # needs nothing installed.
      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nasm clang libclang-dev pkg-config ninja-build

      - name: Checkout vcpkg
        run: |
          set -euo pipefail
          baseline="$(jq -r '."builtin-baseline"' vcpkg.json)"
          git clone https://github.com/microsoft/vcpkg.git "${RUNNER_TEMP}/vcpkg"
          git -C "${RUNNER_TEMP}/vcpkg" checkout --quiet "${baseline}"
          echo "VCPKG_ROOT=${RUNNER_TEMP}/vcpkg" >> "${GITHUB_ENV}"
          echo "VCPKG_DEFAULT_BINARY_CACHE=${RUNNER_TEMP}/vcpkg-cache" >> "${GITHUB_ENV}"
          mkdir -p "${RUNNER_TEMP}/vcpkg-cache"

      # The release job restores from the same keys, so a cold build only happens when
      # the manifest or the ports change.
      - name: Restore vcpkg packages
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-x64-linux-release-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg/ports/**') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-x64-linux-release-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg/ports/**') }}-
            vcpkg-x64-linux-release-

      - name: Build static BestSource and FFmpeg
        run: |
          set -euo pipefail
          "${VCPKG_ROOT}/bootstrap-vcpkg.sh" -disableMetrics
          "${VCPKG_ROOT}/vcpkg" install --triplet x64-linux-release --host-triplet x64-linux-release

      - name: Save vcpkg packages
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      # avtbx-bestsource reads its archive from BESTSOURCE_LIB_DIR, and the build
      # scripts read the rest of the chain through pkg-config.
      - name: Export the static library paths
        run: |
          set -euo pipefail
          prefix="${GITHUB_WORKSPACE}/vcpkg_installed/x64-linux-release"
          echo "BESTSOURCE_LIB_DIR=${prefix}/lib" >> "${GITHUB_ENV}"
          echo "PKG_CONFIG_PATH=${prefix}/lib/pkgconfig" >> "${GITHUB_ENV}"

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      # The same three invocations as the `clippy` Justfile recipe. Hosted runners
      # have no accelerator, so the tests these lint are never run here.
      - name: Clippy
        run: |
          set -euo pipefail
          cargo clippy -p av-denoise-core --features vulkan,avds --all-targets -- -D warnings
          cargo clippy -p av-denoise --features vulkan,static-bestsource --all-targets -- -D warnings
          cargo clippy -p av-denoise-vs --features vulkan --all-targets -- -D warnings

  rust-macos:
    name: build and clippy (macos metal)
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # nasm builds av-scenechange's assembly. The rest is what vcpkg needs to build
      # BestSource, FFmpeg and dav1d. bindgen uses the libclang from the Xcode tools.
      - name: Install build dependencies
        run: brew install nasm pkg-config ninja

      - name: Checkout vcpkg
        run: |
          set -euo pipefail
          baseline="$(jq -r '."builtin-baseline"' vcpkg.json)"
          git clone https://github.com/microsoft/vcpkg.git "${RUNNER_TEMP}/vcpkg"
          git -C "${RUNNER_TEMP}/vcpkg" checkout --quiet "${baseline}"
          echo "VCPKG_ROOT=${RUNNER_TEMP}/vcpkg" >> "${GITHUB_ENV}"
          echo "VCPKG_DEFAULT_BINARY_CACHE=${RUNNER_TEMP}/vcpkg-cache" >> "${GITHUB_ENV}"
          mkdir -p "${RUNNER_TEMP}/vcpkg-cache"

      # The release job restores from the same keys, so a cold build only happens when
      # the manifest or the ports change.
      - name: Restore vcpkg packages
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-arm64-osx-release-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg/ports/**') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-arm64-osx-release-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg/ports/**') }}-
            vcpkg-arm64-osx-release-

      - name: Build static BestSource and FFmpeg
        run: |
          set -euo pipefail
          "${VCPKG_ROOT}/bootstrap-vcpkg.sh" -disableMetrics
          "${VCPKG_ROOT}/vcpkg" install --triplet arm64-osx-release --host-triplet arm64-osx-release

      - name: Save vcpkg packages
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      # avtbx-bestsource reads its archive from BESTSOURCE_LIB_DIR, and the build
      # scripts read the rest of the chain through pkg-config.
      - name: Export the static library paths
        run: |
          set -euo pipefail
          prefix="${GITHUB_WORKSPACE}/vcpkg_installed/arm64-osx-release"
          echo "BESTSOURCE_LIB_DIR=${prefix}/lib" >> "${GITHUB_ENV}"
          echo "PKG_CONFIG_PATH=${prefix}/lib/pkgconfig" >> "${GITHUB_ENV}"

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: |
          set -euo pipefail
          cargo build -p av-denoise-core --no-default-features --features metal,avds
          cargo build -p av-denoise --no-default-features --features metal,static-bestsource
          cargo build -p av-denoise-vs --no-default-features --features metal

      - name: Clippy
        run: |
          set -euo pipefail
          cargo clippy -p av-denoise-core --no-default-features --features metal,avds --all-targets -- -D warnings
          cargo clippy -p av-denoise --no-default-features --features metal,static-bestsource --all-targets -- -D warnings
          cargo clippy -p av-denoise-vs --no-default-features --features metal --all-targets -- -D warnings

  rust-check-windows:
    name: check (windows target)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      # libsqlite3-sys compiles SQLite with the MSVC toolchain, which cargo-xwin
      # provides on Linux through clang-cl, llvm-lib and a downloaded Windows SDK.
      # turso's build script compiles a Windows version resource with `rc.exe`.
      # `llvm-rc` takes the same arguments, so it stands in on the Linux host.
      - name: Provide the MSVC tools
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm clang lld
          mkdir -p "$RUNNER_TEMP/tool-bin"
          ln -s "$(command -v llvm-rc)" "$RUNNER_TEMP/tool-bin/rc.exe"
          if ! command -v clang-cl > /dev/null; then
            clang_cl="$(ls /usr/bin/clang-cl-* | sort -V | tail -n 1)"
            ln -s "$clang_cl" "$RUNNER_TEMP/tool-bin/clang-cl"
          fi
          echo "$RUNNER_TEMP/tool-bin" >> "$GITHUB_PATH"

      - name: Install cargo-xwin
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-xwin

      # The VS plugin has a `#[cfg(windows)]` block that the Linux clippy job
      # never compiles. `cargo check` needs no linker, so this catches a broken
      # signature or flag before a release build does.
      - name: Check
        run: cargo xwin check -p av-denoise-vs --features vulkan --target x86_64-pc-windows-msvc

  python:
    name: ruff and mypy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Ruff format
        run: uvx ruff format --check .

      - name: Ruff lint
        run: uvx ruff check .

      # `--no-project` type-checks the wrapper without building the setuptools-rust
      # extension, so a PR does not pay for a release build of av-denoise-vs.
      - name: Mypy
        run: |
          uv run --with mypy --with vapoursynth --no-project \
            mypy --config-file packages/vs-avd/pyproject.toml packages/vs-avd/src/vsavd
